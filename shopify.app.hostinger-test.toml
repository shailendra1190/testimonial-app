# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "51ddf2c8984c1da493bc91c88f2c2719"
name = "easy-testimonial"
application_url = "https://green-barracuda-892142.hostingersite.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,read_metaobject_definitions"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://green-barracuda-892142.hostingersite.com/auth/callback" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false

[metaobjects.app.testimonial]
name = "Easy Testimonial"
display_name_field = "customer_name"
access.admin = "merchant_read"
access.storefront = "public_read"
capabilities.publishable = true

[metaobjects.app.testimonial.fields.customer_name]
name = "Customer name"
type = "single_line_text_field"
required = true

[metaobjects.app.testimonial.fields.review]
name = "Review"
type = "multi_line_text_field"
required = true

[metaobjects.app.testimonial.fields.rating]
name = "Star rating"
type = "number_integer"
required = true
validations.min = "1"
validations.max = "5"
